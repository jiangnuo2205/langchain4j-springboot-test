spring.application.name=springboot-langchain4j-dashscope
server.port=8090

# ── Provider selection ──────────────────────────────────────────────────────
# llm.provider:       dashscope | ollama  (default: dashscope)
# embedding.provider: dashscope | ollama  (default: dashscope)
# vector.store:       inmemory  | chroma  (default: inmemory)
llm.provider=${LLM_PROVIDER:dashscope}
embedding.provider=${EMBEDDING_PROVIDER:dashscope}
vector.store=${VECTOR_STORE:inmemory}

# ── DashScope (Aliyun Bailian) ───────────────────────────────────────────────
# Set dashscope.api-key via env var DASHSCOPE_API_KEY or application-local.properties
dashscope.api-key=${DASHSCOPE_API_KEY:}
dashscope.model=${DASHSCOPE_MODEL:qwen-turbo}
dashscope.model.strong=${DASHSCOPE_MODEL_STRONG:qwen-plus}
dashscope.temperature=${DASHSCOPE_TEMPERATURE:0.7}
dashscope.embedding-model=${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v3}

# ── Ollama ───────────────────────────────────────────────────────────────────
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.chat-model=${OLLAMA_CHAT_MODEL:qwen3:4b}
ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
ollama.temperature=${OLLAMA_TEMPERATURE:0.7}
ollama.timeout=${OLLAMA_TIMEOUT:60}

# ── Chroma vector store ──────────────────────────────────────────────────────
# Start Chroma: chroma run --host 0.0.0.0 --port 8000 --path ./chroma-data
chroma.base-url=${CHROMA_BASE_URL:http://localhost:8000}
# Use different collection names per embedding provider to avoid mixing vector spaces
chroma.collection=${CHROMA_COLLECTION:langchain4j-springboot-test-rag-dashscope-v3}

# ── RAG configuration ────────────────────────────────────────────────────────
# rag.docs.dir = /path/to/your/docs  (set in application-local.properties)
rag.docs.dir=${RAG_DOCS_DIR:}
rag.chunk.maxChars=${RAG_CHUNK_MAX_CHARS:500}
# Number of characters overlapping between consecutive chunks (0 = disabled).
# Overlap gives retrieval models cross-boundary context and prevents answers
# from being missed when they straddle a chunk boundary.
rag.chunk.overlapChars=${RAG_CHUNK_OVERLAP_CHARS:80}
rag.topK=${RAG_TOP_K:3}
rag.minScore=${RAG_MIN_SCORE:0.0}
rag.index.maxChunksPerFile=${RAG_INDEX_MAX_CHUNKS_PER_FILE:2000}
rag.index.batchSize=${RAG_INDEX_BATCH_SIZE:128}
rag.index.skipHugeFiles.enabled=${RAG_INDEX_SKIP_HUGE_FILES_ENABLED:true}

# ── RAG retrieval diversity ──────────────────────────────────────────────────
# Limits the number of chunks from the same docId returned in a single retrieval.
# This prevents one large document from dominating topK results (e.g. if 8 of the
# top-10 chunks all come from the same file, hit@k metrics and answer quality suffer).
# Set to 0 to disable diversification and return the raw top-K ranking.
# Recommended: 2 (default). Increase if you have very long documents that legitimately
# require many chunks to answer a question.
rag.retrieve.maxChunksPerDoc=${RAG_RETRIEVE_MAX_CHUNKS_PER_DOC:2}

# ── RAG rerank (optional LLM-based reranking) ────────────────────────────────
# Kept off by default for M1 Pro (CPU-only) performance.
rag.rerank.enabled=${RAG_RERANK_ENABLED:false}
rag.rerank.topN=${RAG_RERANK_TOP_N:2}

# ── Answer confidence gate ────────────────────────────────────────────────────
# Minimum top-chunk score required before calling the LLM with retrieved context.
# Queries whose best retrieval score falls below this threshold are refused with
# a helpful message instead of generating a potentially hallucinated answer.
# Set to 0.0 to disable the gate.
rag.answer.minScore=${RAG_ANSWER_MIN_SCORE:0.35}

# ── Hybrid retrieval (Vector + BM25 via Elasticsearch/OpenSearch) ─────────────
# Set rag.hybrid.enabled=true to activate RRF fusion. Requires rag.bm25.enabled=true
# and a running Elasticsearch/OpenSearch instance.
rag.hybrid.enabled=${RAG_HYBRID_ENABLED:true}
rag.bm25.enabled=${RAG_BM25_ENABLED:true}
rag.bm25.elasticsearch.url=${RAG_BM25_ES_URL:http://localhost:9200}
rag.bm25.indexName=${RAG_BM25_INDEX_NAME:rag-chunks}
# Number of candidates fetched from each retriever before RRF fusion (max 50).
rag.hybrid.candidateK=${RAG_HYBRID_CANDIDATE_K:50}
# RRF constant k: higher value = more uniform fusion; lower = top ranks dominate.
# Default 60 is the widely-used standard value.
rag.hybrid.rrf.k=${RAG_HYBRID_RRF_K:60}

# ── Optional: Chroma / LangChain4j debug logging ────────────────────────────
# Uncomment to diagnose Chroma persistence issues:
# logging.level.dev.langchain4j.store.embedding.chroma=DEBUG
# logging.level.dev.langchain4j=DEBUG
